<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Template-based map design studio — pick a cartographic template, drop in OpenStreetMap data, run Earth Engine analysis, and export a print-ready map." />
<title>GIS Design Studio — Map templates for everyone</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>

<!-- ============================================================
     LANDING  — rendered by src/ui/landing.js
     ============================================================ -->
<div id="landing" class="landing"></div>

<!-- Create dialog — rendered by src/ui/create-modal.js -->
<div id="create-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="create-title"></div>

<!-- ============================================================
     STUDIO
     ============================================================ -->
<div id="studio" class="studio is-hidden">

  <header class="studio-header">
    <div class="flex min-w-0 shrink-0 items-center gap-2.5">
      <button id="back-home" class="brand-mark" title="Back to home" aria-label="Back to home">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
      </button>
      <div class="min-w-0">
        <input id="project-name" class="project-name-input" value="Untitled map" aria-label="Project name" />
        <p class="project-subline" id="project-subline">Map template · A4 Portrait</p>
      </div>
    </div>

    <!-- Guided steps: keeps non-GIS users oriented -->
    <ol class="step-strip" id="step-strip" aria-label="Steps"></ol>

    <div class="flex shrink-0 items-center gap-1.5">
      <button id="undo-btn" class="icon-btn" title="Undo (Ctrl+Z)" aria-label="Undo">↺</button>
      <button id="redo-btn" class="icon-btn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">↻</button>
      <span class="header-sep"></span>
      <button id="export-png-btn" class="btn-ghost">PNG</button>
      <button id="export-pdf-btn" class="btn-primary">Export PDF</button>
    </div>
  </header>

  <div class="studio-body">

    <!-- Left icon rail -->
    <nav class="tool-rail" id="tool-rail" aria-label="Studio tools"></nav>

    <!-- Left panel (content switches with the rail) -->
    <aside class="side-panel" id="left-panel" aria-live="polite">
      <section class="panel-pane" data-pane="templates" id="pane-templates"></section>
      <section class="panel-pane" data-pane="area"      id="pane-area"></section>
      <section class="panel-pane" data-pane="data"      id="pane-data"></section>
      <section class="panel-pane" data-pane="analysis"  id="pane-analysis"></section>
      <section class="panel-pane" data-pane="ai"        id="pane-ai"></section>
      <section class="panel-pane" data-pane="elements"  id="pane-elements"></section>
      <section class="panel-pane" data-pane="layers"    id="pane-layers"></section>
    </aside>

    <!-- Canvas -->
    <main class="canvas-wrap" id="canvas-wrap">
      <div id="map" class="map-root"></div>
      <div id="map-tint" class="map-tint" aria-hidden="true"></div>

      <!-- floating map controls -->
      <div class="map-controls" id="map-controls"></div>

      <!-- The printable page. Elements live inside it. -->
      <div id="artboard" class="artboard">
        <div id="artboard-label" class="artboard-label"></div>
        <div id="element-layer" class="element-layer"></div>
      </div>

      <div class="canvas-hint" id="canvas-hint"></div>
    </main>

    <!-- Right panel: element inspector / page setup -->
    <aside class="side-panel side-panel--right" id="right-panel"></aside>
  </div>

  <footer class="studio-footer" id="studio-footer"></footer>
</div>

<div id="toast-stack" class="toast-stack" aria-live="polite"></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
